[package]
name = "winpulse-cs2"
version = "1.0.0"
description = "Utilitário nativo em Rust para otimização do Windows 11, planos de energia, limpeza de temporários e Counter-Strike 2"
authors = ["WinPulse CS2"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
